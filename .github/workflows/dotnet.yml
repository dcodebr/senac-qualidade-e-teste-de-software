
name: NUnit Tests - Multi Platform

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: NUnit Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore dotnet/Calculadora/Senac.TQS.Calculadora.Test

      - name: Execute NUnit Tests
        run: dotnet test dotnet/Calculadora/Senac.TQS.Calculadora.Test --no-restore --logger "console;verbosity=normal"
